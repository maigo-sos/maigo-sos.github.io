<style>
:root{
  --bg:#fdf6f3; --navy:#2a1f1a; --rose:#b5647a; --rose-light:#d4a0b0; --rose-pale:#f0dada;
  --rose-deep:#9e4e68; --gold:#c9a882; --text:#2c2220; --text-muted:#7a6560;
  --serif:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
  --display:'Cormorant Garamond','Noto Serif JP',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--serif);font-size:16px;line-height:1.8;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--rose-deep)}
img{max-width:100%;display:block}
header.site{padding:28px 20px 20px;text-align:center;border-bottom:1px solid var(--rose-pale)}
header.site a{text-decoration:none;color:var(--navy)}
.brand-en{font-family:var(--display);font-size:15px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;display:block}
.brand-ja{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:.14em;color:var(--navy);display:block;line-height:1.6}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:36px 20px 56px}
h1,h2,h3{font-family:var(--serif);font-weight:500;color:var(--navy);line-height:1.6}
h1{font-size:26px;letter-spacing:.1em;margin-bottom:8px}
h2{font-size:20px;letter-spacing:.08em;margin:36px 0 12px}
h3{font-size:17px;margin:20px 0 6px}
.eyebrow{font-family:var(--display);font-size:16px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.lead{color:var(--text-muted);margin-bottom:28px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.filters select,.filters input{min-height:46px}
.about{font-size:17px;line-height:2;margin-bottom:22px}
dl.facts dd.voice{background:#fff;border:1px solid var(--rose-pale);padding:14px 16px;margin-top:6px;font-size:17px}
.nudge{font-size:17px;color:var(--rose-deep);line-height:1.9;margin:26px 0 4px}
.tagline{font-size:22px;letter-spacing:.12em;color:var(--rose-deep);line-height:1.8;margin:4px 0 26px}
.rule{height:1px;background:var(--rose-pale);border:0;margin:28px 0}
.crumb{display:inline-flex;align-items:center;min-height:44px;font-size:15px;color:var(--text-muted);text-decoration:none;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:2px;border:1px solid var(--rose-deep);background:var(--rose-deep);color:#fff;font-family:var(--serif);font-size:16px;letter-spacing:.1em;text-decoration:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--rose-deep)}
.btn.block{display:flex;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}
.btns .btn{flex:1 1 200px}
.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0 28px}
.areas a,.areas span{display:flex;align-items:center;justify-content:center;min-height:56px;border:1px solid var(--rose-light);background:#fff;color:var(--navy);text-decoration:none;letter-spacing:.12em;border-radius:2px;text-align:center}
.areas span{border-color:var(--rose-pale);background:transparent;color:var(--text-muted);opacity:.7;font-size:15px}
.region{font-size:16px;letter-spacing:.14em;color:#8a6d45;margin:22px 0 4px}
.areas small{display:block;font-size:12px;color:var(--text-muted);letter-spacing:.05em}
.tabs{display:flex;border-bottom:1px solid var(--rose-pale);margin:20px 0}
.tabs a{flex:1;text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text-muted);letter-spacing:.1em;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--rose-deep);border-bottom-color:var(--rose-deep)}
.card{display:flex;gap:16px;background:#fff;border:1px solid var(--rose-pale);padding:12px;margin-bottom:14px;text-decoration:none;color:var(--text);border-radius:2px}
.card .ph{flex:0 0 96px;width:96px;height:96px;background:var(--rose-pale);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .bd{min-width:0;flex:1}
.card .t{font-size:17px;color:var(--navy);line-height:1.6;overflow-wrap:anywhere}
.card .m{font-size:14px;color:var(--text-muted);line-height:1.7;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:13px;letter-spacing:.1em;padding:0 10px;line-height:1.9;border:1px solid var(--rose-deep);color:var(--rose-deep);margin-right:6px;vertical-align:middle}
.badge.found{background:var(--rose-deep);color:#fff}
.badge.sighting{border-color:var(--gold);color:#8a6d45}
.badge.done{border-color:var(--text-muted);color:var(--text-muted)}
.msg{padding:28px 0;text-align:center;color:var(--text-muted)}
.err{color:var(--rose-deep);padding:20px 0}
.band{background:var(--rose-pale);color:var(--rose-deep);text-align:center;padding:10px 16px;letter-spacing:.14em;margin-bottom:20px}
.gallery img{width:100%;margin-bottom:10px;border-radius:2px;background:var(--rose-pale)}
dl.facts{margin:20px 0}
dl.facts dt{font-size:13px;letter-spacing:.14em;color:var(--gold);margin-top:14px}
dl.facts dd{overflow-wrap:anywhere;white-space:pre-wrap}
.notice{background:#fff;border:1px solid var(--rose-pale);padding:18px 20px;margin:24px 0;font-size:15px}
.field{margin-bottom:22px}
label.l{display:block;font-size:15px;letter-spacing:.06em;margin-bottom:6px;color:var(--navy)}
label.l em{font-style:normal;color:var(--rose-deep);font-size:13px;margin-left:6px}
.help{font-size:14px;color:var(--text-muted);margin-bottom:6px;line-height:1.7}
input[type=text],input[type=email],input[type=date],textarea,select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--rose-light);background:#fff;color:var(--text);font-family:var(--serif);font-size:16px;line-height:1.7;border-radius:2px;-webkit-appearance:none;appearance:none}
textarea{min-height:120px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--rose-deep) 50%),linear-gradient(135deg,var(--rose-deep) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:40px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--rose-light);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border:1px solid var(--rose-light);background:#fff;border-radius:2px;letter-spacing:.08em;cursor:pointer}
.opts input:checked+span{background:var(--rose-deep);border-color:var(--rose-deep);color:#fff}
.opts input:focus-visible+span{outline:2px solid var(--rose-light);outline-offset:1px}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:2px}
.copybox{background:#fff;border:1px solid var(--rose-light);padding:12px 14px;word-break:break-all;font-size:15px;margin:8px 0 16px}
footer.site{border-top:1px solid var(--rose-pale);padding:28px 20px 40px;text-align:center;font-size:14px;color:var(--text-muted)}
footer.site a{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}
/* flyer */
.flyer{background:#fff;border:1px solid var(--rose-pale);padding:28px 24px;text-align:center}
.flyer .big{font-size:44px;letter-spacing:.3em;color:var(--rose-deep);font-weight:600;line-height:1.4;margin-bottom:16px}
.flyer .main{width:100%;max-height:420px;object-fit:contain;margin:0 auto 12px;background:var(--rose-pale)}
.flyer .sub{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.flyer .sub img{width:90px;height:90px;object-fit:cover}
.flyer dl{text-align:left;max-width:520px;margin:0 auto}
.flyer dt{font-size:13px;letter-spacing:.14em;color:#8a6d45;margin-top:10px}
.flyer dd{font-size:18px;overflow-wrap:anywhere;white-space:pre-wrap}
.flyer .how{margin-top:22px;border-top:1px solid var(--gold);padding-top:14px;font-size:16px}
.flyer .url{font-size:13px;word-break:break-all;margin-top:6px;color:var(--text-muted)}
.flyer .qrwrap{display:flex;gap:18px;align-items:center;justify-content:center;text-align:left}
.flyer .qr{width:150px;height:150px;flex:0 0 150px}
.flyer .qr svg{width:150px;height:150px;display:block}
.flyer .qrtext{font-size:17px;line-height:1.7}
@media print{.flyer .qr,.flyer .qr svg{width:42mm;height:42mm;flex-basis:42mm}}
@media (min-width:600px){.areas{grid-template-columns:repeat(3,1fr)}}
@media print{
  @page{size:A4 portrait;margin:6mm}
  .flyer{page-break-inside:avoid;break-inside:avoid}
  .flyer .big{font-size:44pt;margin-bottom:6mm}
  .flyer .main{max-height:95mm !important}
  .flyer .sub{display:none}
  .flyer dd{font-size:13pt;line-height:1.6;max-height:34mm;overflow:hidden}
  .flyer dd.feat{max-height:40mm}
  .flyer .how{margin-top:6mm;padding-top:4mm}
  .flyer .qr,.flyer .qr svg{width:38mm;height:38mm;flex-basis:38mm}
  .flyer .qrtext{font-size:12pt}
  .flyer .url{font-size:9pt}
  body{background:#fff;display:block}
  header.site,footer.site,.noprint,.crumb{display:none !important}
  main{max-width:none;padding:0}
  .flyer{border:0;padding:0}
  .flyer .big{font-size:56px}
  .flyer .main{max-height:105mm}
  .flyer dd{font-size:16pt}
}
.langsw{display:flex;justify-content:flex-end;align-items:center;margin:-16px -8px 6px 0;font-size:14px;color:var(--text-muted)}
.langsw button{min-height:44px;min-width:44px;padding:0 10px;border:0;background:transparent;font-family:var(--serif);font-size:14px;letter-spacing:.06em;color:var(--text-muted);cursor:pointer}
.langsw button.on{color:var(--navy);font-weight:600}
.brand-main{font-family:var(--display);font-size:30px;font-weight:500;letter-spacing:.14em;color:var(--navy);display:block;line-height:1.4}
.brand-sub{font-size:13px;letter-spacing:.14em;color:var(--text-muted);display:block}
.viewsw{display:flex;margin:0 0 14px;border:1px solid var(--rose-light);border-radius:2px;overflow:hidden}
.viewsw button{flex:1;min-height:44px;border:0;background:#fff;font-family:var(--serif);font-size:15px;letter-spacing:.1em;color:var(--text-muted);cursor:pointer;-webkit-appearance:none;appearance:none}
.viewsw button.on{background:var(--rose-deep);color:#fff}
.mapbox{height:60vh;min-height:360px;border:1px solid var(--rose-pale);margin-bottom:14px;background:var(--rose-pale);position:relative;z-index:0}
.mapbox.small{height:220px;min-height:0;margin:10px 0 4px}
.mapnote{font-size:13px;color:var(--text-muted)}
.mp{display:flex;gap:10px;width:230px;font-family:var(--serif)}
.mp .ph{flex:0 0 64px;width:64px;height:64px;background:var(--rose-pale);overflow:hidden;font-size:11px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;text-align:center}
.mp .ph img{width:100%;height:100%;object-fit:cover}
.mp .bd{min-width:0;flex:1;font-size:13px;line-height:1.6;color:var(--text)}
.mp .bd .t{font-size:14px;color:var(--navy);overflow-wrap:anywhere}
.mp .bd a{display:inline-block;min-height:32px;line-height:32px}

/* flyer v3（明るいチラシ） */
.fl2{background:#fff;border:3px solid #e8407c;border-radius:10px;overflow:hidden;padding:0;text-align:left;width:100%;max-width:600px;margin:0 auto;font-family:'Zen Maru Gothic','Noto Serif JP',sans-serif;color:#3a2a2e}
.fl2 .fl-head{background:#e8407c;color:#fff;padding:20px 20px 16px;text-align:center}
.fl2 .fl-big{font-size:40px;letter-spacing:.1em;font-weight:900;line-height:1.25;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.fl2 .fl-sub{font-size:24px;font-weight:700;letter-spacing:.08em;margin-top:8px;background:#ffd84d;color:#5a3f00;display:inline-block;padding:4px 18px;border-radius:999px}
.fl2 .fl-photo{background:#fff6f8;height:340px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fl2 .fl-photo img{width:100%;height:100%;object-fit:contain}
.fl2 .fl-nophoto{color:#b08a94;font-size:18px}
.fl2 .fl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px 0}
.fl2 .fl-cell{background:#fff2a8;border-radius:8px;padding:10px 14px;border:2px solid #ffd84d}
.fl2 .fl-k{font-size:12px;letter-spacing:.14em;color:#c2185b;font-weight:700}
.fl2 .fl-v{font-size:19px;font-weight:700;line-height:1.45;color:#3a2a2e;overflow-wrap:anywhere}
.fl2 .fl-feats{padding:12px 16px 4px}
.fl2 .fl-feats .fl-k{color:#e8407c}
.fl2 .fl-feats ul{list-style:none;margin:4px 0 0;padding:0}
.fl2 .fl-feats li{font-size:18px;font-weight:500;line-height:1.55;padding:3px 0 3px 20px;position:relative}
.fl2 .fl-feats li:before{content:'';position:absolute;left:2px;top:13px;width:9px;height:9px;border-radius:50%;background:#e8407c}
.fl2 .fl-foot{display:flex;gap:16px;align-items:center;padding:14px 16px 16px;margin-top:10px;background:#ffe1ec}
.fl2 .qr{width:128px;height:128px;flex:0 0 128px;background:#fff;padding:6px;border-radius:8px}
.fl2 .qr svg{width:100%;height:100%;display:block}
.fl2 .fl-call1{font-size:17px;font-weight:900;line-height:1.55;color:#d6286a}
.fl2 .url{font-size:11px;color:#9a7f86;word-break:break-all;margin-top:6px}
.fl2 .fl-brand{font-size:12px;letter-spacing:.1em;color:#b08a94;margin-top:6px}
@media print{
  .fl2{max-width:none;border:0;border-radius:0;height:auto;overflow:visible;display:block;page-break-inside:avoid;break-inside:avoid}
  .fl2 .fl-head{padding:5mm 4mm 4mm}
  .fl2 .fl-big{font-size:30pt}
  .fl2 .fl-sub{font-size:15pt}
  .fl2 .fl-photo{height:88mm}
  .fl2 .fl-grid{padding:4mm 4mm 0}
  .fl2 .fl-v{font-size:13pt}
  .fl2 .fl-feats{padding:3mm 5mm 0}
  .fl2 .fl-feats li{font-size:12pt;line-height:1.4}
  .fl2 .fl-foot{padding:4mm;margin-top:3mm}
  .fl2 .qr{width:36mm;height:36mm;flex-basis:36mm}
  .fl2 .fl-call1{font-size:12pt}
  .fl2 .url{font-size:7pt}
}

/* スマホ幅ではみ出し防止：grid/flexの子が中身の幅で広がらないように */
html,body{max-width:100%;overflow-x:hidden}
main,header.site,footer.site{max-width:100%;min-width:0}
.filters>*,.areas>*,.btns>*,.tabs>*,.fl-grid>*{min-width:0}
select,input,textarea{max-width:100%}
.filters select,.filters input{width:100%}
.card{min-width:0}

.cta2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 14px}
.cta{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:92px;border-radius:4px;text-decoration:none;padding:12px 8px;text-align:center}
.cta .c1{font-size:19px;font-weight:600;letter-spacing:.08em;line-height:1.4}
.cta .c2{font-size:13px;margin-top:4px;opacity:.9}
.cta.lost{background:var(--rose-deep);color:#fdf6f3}
.cta.found{background:#fff;color:#7a5a2a;border:2px solid var(--gold)}
details.prefs{margin:26px 0 10px}
details.prefs summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-size:17px;color:var(--rose-deep);letter-spacing:.06em;list-style:none}
details.prefs summary::-webkit-details-marker{display:none}
details.prefs summary:before{content:'';display:inline-block;width:8px;height:8px;border-right:2px solid var(--rose-deep);border-bottom:2px solid var(--rose-deep);transform:rotate(-45deg);margin-right:12px;transition:transform .2s}
details.prefs[open] summary:before{transform:rotate(45deg)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ===== bright theme（まさみ「HPも明るく」2026-10-30）===== */
:root{--bg:#fff5f8;--rose:#e8407c;--rose-deep:#d6286a;--rose-light:#f7a3c0;--rose-pale:#ffe1ec;--gold:#f5b800;--text:#3a2a2e;--text-muted:#8a7278;--navy:#3a2a2e;--maru:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif}
body{background:var(--bg)}
header.site{background:#fff;border-bottom:2px solid var(--rose-pale)}
.brand-en{color:var(--rose)}
.brand-ja,h1,h2,h3,.tagline,.btn,.cta,.areas a,.tabs a,.badge,.viewsw button,details.prefs summary,.region,.eyebrow{font-family:var(--maru)}
h1{font-weight:900;letter-spacing:.06em}
h2{font-weight:700}
.tagline{font-weight:700;color:var(--rose);font-size:24px}
.eyebrow{letter-spacing:.22em;color:var(--rose)}
.lead{color:var(--text-muted)}
.btn{border-radius:999px;font-weight:700;letter-spacing:.06em;border-width:2px}
.btn.ghost{background:#fff}
.cta{border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.cta.lost{background:var(--rose);color:#fff}
.cta.found{background:#ffd84d;color:#5a3f00;border:2px solid #ffd84d}
.cta .c1{font-weight:900}
.areas a{border-radius:12px;border-color:var(--rose-pale);font-weight:700;color:var(--rose-deep);background:#fff}
.areas span{border-radius:12px}
.tabs a{font-weight:700}
.tabs a.on{color:var(--rose)}
.card{border-radius:14px;border-color:var(--rose-pale);box-shadow:0 2px 0 rgba(0,0,0,.04)}
.card .ph{border-radius:10px;background:#fff0f4}
.card .t{font-family:var(--maru);font-weight:700}
.badge{border-radius:999px;font-weight:700;padding:0 12px;background:var(--rose-pale);border-color:transparent;color:var(--rose-deep)}
.badge.found{background:var(--rose);color:#fff}
.badge.sighting{background:#ffd84d;color:#5a3f00;border-color:transparent}
.badge.done{background:#eee;color:#777}
.notice{border-radius:14px;background:#fff;border-color:var(--rose-pale)}
.nudge{font-family:var(--maru);font-weight:700;color:var(--rose)}
.band{border-radius:999px;font-family:var(--maru);font-weight:700;background:#ffd84d;color:#5a3f00}
input[type=text],input[type=email],input[type=date],textarea,select{border-radius:12px;border-color:var(--rose-light);background:#fff}
.opts span{border-radius:999px;font-family:var(--maru);font-weight:700}
.opts input:checked+span{background:var(--rose);border-color:var(--rose)}
.filters select,.filters input{border-radius:12px}
.viewsw button{border-radius:999px}
dl.facts dt{color:var(--rose);font-family:var(--maru);font-weight:700;letter-spacing:.1em}
dl.facts dd.voice{border-radius:12px;background:#fff8d6;border-color:#ffd84d}
.copybox{border-radius:12px}
footer.site{background:#fff;border-top:2px solid var(--rose-pale)}
.about{font-family:var(--serif)}

/* poster v4：ニラーさんのチラシ型 */
/* poster (p4): fixed 620x877 canvas (A4 ratio). Screen, image and PDF all use the same layout; phones scale it with JS */
.p4wrap{position:relative;width:100%;max-width:620px;margin:0 auto 16px;overflow:hidden}

  position:absolute;left:0;top:0;width:620px;height:877px;box-sizing:border-box;padding:10px;margin:0;border:0;border-radius:6px;overflow:hidden;
  display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--pd);font-weight:900;transform-origin:0 0;
  background-color:var(--pbg);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14'><path d='M-3 3L3 -3M0 14L14 0M11 17L17 11' stroke='%23c0003c' stroke-opacity='.045' stroke-width='3.5'/></svg>");
  font-family:'M PLUS Rounded 1c','Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif}
.flyer.p4 *{box-sizing:border-box}

.capwrap{position:fixed;left:0;top:0;width:620px;z-index:-1;pointer-events:none}
.flyer.p4 ul{list-style:none;margin:0;padding:0}
.p4-head,.p4-main,.p4-yel,.p4-ct{flex:none}

す</li><li>新着通知のメールアドレス：選んだ都道府県の新着をお知らせするために使います</li><li>投稿内容（都道府県・市区町村・場所・日時・特徴・写真・名前・種類・ひとこと）：掲示板に公開します</li></ul><p>電話番号と住所は入力欄がなく、投稿に書かれていても受け付けません。Cookieとアクセス解析は使いません。言語と表示の設定だけを、お使いの端末（ブラウザ）に保存します。</p><h2>2. 外部に渡す情報</h2><ul><li>その投稿の投稿者：連絡のメッセージと返信先を転送します</li><li>Google（スプレッドシート・Drive・Apps Script）：データの保存とメールの送信に使います。写真は「リンクを知っている人は見られる」設定で保存します。Googleのサーバーは、アメリカなど日本の外にある場合があります</li><li>OpenStreetMap Nominatim：投稿の都道府県・市区町村・場所を送り、地図上のおおよその位置を求めます</li><li>運営のSNS（X @maigopet_sos・Threads・Bluesky・Instagram・Facebook）：投稿の本文と写真1枚を紹介することがあります。各SNSの運営会社にも、その内容が渡ります</li><li>画面を表示するために、Google Fonts・cdnjs・OpenStreetMapの地図から部品を読み込みます。このとき、お使いの端末のIPアドレスなどがそれぞれの提供元に送られます</li></ul><p>また、他の迷子掲示板や自治体の公開情報を自動で確認し、似た情報を投稿者にメールでお知らせします。上に書いた場合と法律に基づく場合のほかは、本人の同意なく第三者に渡しません。</p><h2>3. 保存する期間</h2><ul><li>投稿・メールアドレス・合言葉：投稿の終了または非表示から1年</li><li>連絡の記録：転送から90日</li><li>新着通知の登録：解除されるまで</li></ul><p>期間が過ぎたものは自動で消去します。</p><h2>4. 情報の守り方</h2><p>保存先を見られるのは運営者だけです。公開しない情報は、画面に出ない仕組みにしています。</p><h2>5. 開示・訂正・削除などの請求</h2><p>ご自身の情報の開示・訂正・削除・利用停止は、下記のメールでお申し出ください。本人確認（投稿に使ったメールアドレスからの送信など）をしたうえで、遅滞なく対応します。新着通知は、メール内のリンクからいつでも解除できます。</p><h2>6. お問い合わせ</h2><p><a href=\"mailto:honeypots.m@gmail.com\">honeypots.m@gmail.com</a></p><h2>7. 改定</h2><p>このポリシーを変えるときは、このページでお知らせします。これまでの使いみちと関係のない使いみちを加えるときは、あらためて同意をいただきます。</p>"};

var REGION_EN = {'北海道・東北':'Hokkaido & Tohoku','関東':'Kanto','中部':'Chubu','近畿':'Kinki (Kansai)','中国・四国':'Chugoku & Shikoku','九州・沖縄':'Kyushu & Okinawa'};
var MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function pickLang(){
  var m=/[?&]lang=(ja|en)\b/.exec(location.search); if(m) return m[1];
  try{ var s=localStorage.getItem('maigo_lang'); if(s==='ja'||s==='en') return s; }catch(e){}
  var n=(navigator.language||'ja').toLowerCase();
  return n.indexOf('ja')===0?'ja':'en';
}
var lang = pickLang();
function t(k,a){
  var v=T[lang][k]; if(v==null) v=T.ja[k]; if(v==null) return k;
  if(a!=null && typeof v==='string'){ if(typeof a==='object' && !Array.isArray(a)){ for(var x in a) v=v.split('{'+x+'}').join(a[x]); } else { v=v.split('{0}').join(a); } }
  return v;
}
function typeLabel(k){ return t({lost:'typeLost',found:'typeFound',sighting:'typeSighting'}[k]||'')||k; }
function typeName(k){ var m={lost:'typeLost',found:'typeFound',sighting:'typeSighting'}[k]; return m?t(m):(k||''); }
function spName(k){ var m={dog:'spDog',cat:'spCat',bird:'spBird',other:'spOther'}[k]; return m?t(m):''; }
function stName(k){ var m={closed_found:'stClosedFound',closed_cancel:'stClosedCancel'}[k]; return m?t(m):''; }
function rname(r){ return lang==='en'?(REGION_EN[r]||r):r; }
function pname(a){ return lang==='en'?(a.id.charAt(0).toUpperCase()+a.id.slice(1)):a.name; }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function area(id){ for(var i=0;i<AREAS.length;i++) if(AREAS[i].id===id) return AREAS[i]; return null; }
function areaName(id){ var a=area(id); return a?pname(a):(id||''); }
function openAreas(){ return AREAS.filter(function(a){return a.open;}); }

function renderChrome(){
  document.documentElement.lang=lang;
  document.title=t('title');
  var h=document.getElementById('hdr');
  var sw='<div class="langsw" role="group" aria-label="Language"><button type="button" data-lang="ja"'+(lang==='ja'?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>日本語</button><span aria-hidden="true">｜</span><button type="button" data-lang="en"'+(lang==='en'?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>English</button></div>';
  var brand = lang==='en'
    ? '<a href="#/"><span class="brand-main">Lost Pet SOS</span><span class="brand-sub">迷子ペットSOS</span></a>'
    : '<a href="#/"><span class="brand-en">Lost Pet SOS</span><span class="brand-ja">迷子ペットSOS</span></a>';
  h.innerHTML=sw+brand;
  var btns=h.querySelectorAll('button[data-lang]');
  for(var i=0;i<btns.length;i++) btns[i].addEventListener('click',function(){ setLang(this.getAttribute('data-lang')); });
  var f=document.getElementById('ftr');
  f.innerHTML='<div>'+esc(t('footOp'))+'</div><div><a href="#/about">'+esc(t('footAbout'))+'</a>　<a href="#/terms">'+esc(t('footTerms'))+'</a>　<a href="#/privacy">'+esc(t('footPrivacy'))+'</a></div><div><a href="mailto:honeypots.m@gmail.com?subject='+encodeURIComponent(t('delSubject'))+'">'+esc(t('footDel'))+'</a></div>';
}
function setLang(l){
  if(l!==lang){
    lang=l;
    try{ localStorage.setItem('maigo_lang',l); }catch(e){}
    try{ if(/[?&]lang=/.test(location.search)){ var q=location.search.replace(/([?&])lang=[^&]*&?/,'$1').replace(/[?&]$/,''); history.replaceState(null,'',location.pathname+q+location.hash); } }catch(e){}
  }
  renderChrome();
  route();
}

function api(method, params, body){
  if(!API_URL || API_URL==='PASTE_GAS_URL') return Promise.resolve({ok:false,error:t('noApi')});
  var p;
  if(method==='GET'){
    var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
    p=fetch(API_URL+'?'+q);
  } else {
    p=fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
  }
  return p.then(function(r){return r.json();}).catch(function(){return {ok:false,error:t('netFail')};});
}
function loading(){ return '<p class="msg">'+esc(t('loading'))+'</p>'; }
function errHtml(e){ return '<p class="err">'+esc(e||t('loadFail'))+'</p>'; }
function crumb(href,label){ return '<a class="crumb" href="'+href+'">'+esc(label)+'</a>'; }
function noticeHtml(){ return '<div class="notice">'+esc(t('notice'))+'</div>'; }
function firstPhoto(p){ var u=photos(p); return u.length?u[0]:''; }
function photos(p){
  var u=p.photoUrls; if(typeof u==='string'){ try{u=JSON.parse(u);}catch(e){u=[];} }
  return Array.isArray(u)?u:[];
}
function badge(p){
  var cls = p.type==='found'?'found':(p.type==='sighting'?'sighting':'');
  return '<span class="badge '+cls+'">'+esc(typeName(p.type))+'</span>';
}
function fmtDate(s){
  if(!s) return ''; var d=new Date(s); if(isNaN(d)) return String(s);
  return t('dateFmt',{y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate(),mon:MONTHS_EN[d.getMonth()]});
}
function pageUrl(h){ return location.href.split('#')[0].replace(/([?&])lang=[^&]*&?/,'$1').replace(/[?&]$/,'')+'#'+h; }
function parseHash(){
  var h=location.hash.replace(/^#/,'')||'/';
  var qi=h.indexOf('?'), q={};
  if(qi>=0){ h.slice(qi+1).split('&').forEach(function(kv){var a=kv.split('=');if(a[0])q[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||'');}); h=h.slice(0,qi); }
  return {parts:h.split('/').filter(Boolean), q:q};
}
function regions(){
  var order=[];
  openAreas().forEach(function(a){ if(order.indexOf(a.region)<0) order.push(a.region); });
  return order;
}
function areaSelect(id,sel){
  var h='<select id="'+id+'">';
  regions().forEach(function(r){
    h+='<optgroup label="'+esc(rname(r))+'">';
    openAreas().filter(function(a){return a.region===r;}).forEach(function(a){ h+='<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(pname(a))+'</option>'; });
    h+='</optgroup>';
  });
  return h+'</select>';
}
function whereText(p){ return (p.city?p.city+(p.place?' ・ ':''):'')+(p.place||''); }
function animalTitle(p){ return (spName(p.species))+(p.name?'　'+p.name:''); }

/* ---------- routes ---------- */
function route(){
  var r=parseHash(), p=r.parts, my=++rid;
  killMaps();
  window.scrollTo(0,0);
  if(!p.length) return viewHome(my);
  var k=p[0];
  if(k==='area') return viewArea(p[1],r.q,my);
  if(k==='post') return viewPost(p[1],my);
  if(k==='new') return viewNew(r.q.area,null,r.q.type);
  if(k==='contact') return viewContact(p[1],my);
  if(k==='manage') return viewManage(p[1],p[2],my);
  if(k==='edit') return viewEdit(p[1],p[2],my);
  if(k==='flyer') return viewFlyer(p[1],my);
  if(k==='guide') return viewGuide(p[1],r.q.city);
  if(k==='subscribe') return viewSubscribe(r.q.area);
  if(k==='about') return viewAbout();
  if(k==='terms'||k==='privacy') return viewLegal(k);
  viewHome(my);
}

/* ---------- map ---------- */
var maps=[];
function killMaps(){ maps.forEach(function(m){ try{ m.remove(); }catch(e){} }); maps=[]; }
function ll(p){ var a=parseFloat(p.lat), b=parseFloat(p.lng); return (isFinite(a)&&isFinite(b))?[a,b]:null; }
function pinColor(p){ return p.type==='lost'?'#9e4e68':'#c9a882'; }
function popupHtml(p){
  var ph=firstPhoto(p);
  return '<div class="mp"><div class="ph">'+(ph?'<img src="'+esc(ph)+'" alt="">':esc(t('noPhoto')))+'</div><div class="bd"><div>'+badge(p)+'</div><div class="t">'+esc(animalTitle(p))+'</div><div>'+esc(p.city||'')+'</div><div>'+esc(p.datetime||'')+'</div><a href="#/post/'+esc(p.id)+'">'+esc(t('mapView'))+'</a></div></div>';
}
function newMap(el){
  if(typeof L==='undefined'){ el.innerHTML='<p class="msg">'+esc(t('mapFail'))+'</p>'; return null; }
  var m=L.map(el,{scrollWheelZoom:false}).setView([36.5,137.5],5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);
  maps.push(m);
  return m;
}
// 一覧／地図の切替。戻り値 update(list, fit) を絞り込みのたびに呼ぶ
function listMapView(swEl,mapEl,listEl,fitDefault){
  var mode='list', map=null, layer=null, last=null;
  try{ if(localStorage.getItem('maigo_view')==='map') mode='map'; }catch(e){}
  swEl.innerHTML='<button type="button" data-v="list">'+esc(t('viewList'))+'</button><button type="button" data-v="map">'+esc(t('viewMap'))+'</button>';
  function paint(){
    var b=swEl.querySelectorAll('button');
    for(var i=0;i<b.length;i++){ var on=b[i].getAttribute('data-v')===mode; b[i].className=on?'on':''; b[i].setAttribute('aria-pressed',on?'true':'false'); }
    listEl.style.display=mode==='map'?'none':''; mapEl.style.display=mode==='map'?'':'none';
    if(mode==='map') drawMap();
  }
  function drawMap(){
    if(!map){ map=newMap(mapEl); if(!map) return; layer=L.layerGroup().addTo(map); }
    map.invalidateSize();
    layer.clearLayers();
    if(!last) return;
    var pts=[];
    last.list.forEach(function(p){
      var c=ll(p); if(!c) return;
      pts.push(c);
      L.circleMarker(c,{radius:9,color:'#fff',weight:2,fillColor:pinColor(p),fillOpacity:.95}).bindPopup(popupHtml(p)).addTo(layer);
    });
    if(pts.length&&(last.fit||fitDefault)) map.fitBounds(L.latLngBounds(pts),{padding:[30,30],maxZoom:13});
    else map.setView([36.5,137.5],5);
  }
  swEl.addEventListener('click',function(e){
    var v=e.target&&e.target.getAttribute&&e.target.getAttribute('data-v'); if(!v) return;
    mode=v; try{ localStorage.setItem('maigo_view',v); }catch(er){}
    paint();
  });
  paint();
  return function(list,fit){ last={list:list,fit:fit}; if(mode==='map') drawMap(); };
}

}

/* ---------- photos ---------- */
function shrink(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej();};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej();};
      im.onload=function(){
        var w=im.naturalWidth,h=im.naturalHeight,m=Math.max(w,h),s=m>1200?1200/m:1;
        var c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
        var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.8));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function hasPhone(s0){
  var s=String(s0||'').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);}).replace(/[\-‐－ー―\s　()（）]/g,'');
  return /0\d{9,10}/.test(s);
}
function clip(x,n){ x=String(x||'').replace(/\n{2,}/g,'\n').trim(); return x.length>n?x.slice(0,n)+'…':x; }
function dateText(){
  var v=val('date'), tv=val('tod'); if(!v||tv==='') return '';
  var tod=t('tods')[+tv]; if(!tod) return '';
  var p=v.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); var w=t('wd')[d.getDay()];
  return t('mdFmt',{m:+p[1],d:+p[2],w:w,mon:MONTHS_EN[+p[1]-1]})+(lang==='en'?', ':' ')+tod;
}

function checked(name){ var e=document.querySelector('input[name="'+name+'"]:checked'); return e?e.value:''; }

    var lat=parseFloat(p.lat), lng=parseFloat(p.lng);
    var mapP=Promise.resolve(), mapTok=0, mapKey='', mapTimer=0;
    var hasLL=isFinite(lat)&&isFinite(lng)&&Math.abs(lat)<=85&&Math.abs(lng)<=180&&(lat||lng);
    function drawMap(){
      if(!hasLL) return;
      var box0=document.getElementById('p4map'); if(!box0) return;
      var key=box0.clientWidth+'x'+box0.clientHeight; if(key===mapKey) return; mapKey=key;
      var tok=++mapTok;
      mapP=new Promise(function(res,rej){
        var box=document.getElementById('p4map'), W=box.clientWidth*2, H=box.clientHeight*2, z=15, n=Math.pow(2,z), S=512;
        var rad=lat*Math.PI/180, fx=(lng+180)/360*n, fy=(1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*n;
        var x0=fx*S-W/2, y0=fy*S-H/2, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
        var cx=cv.getContext('2d'); cx.fillStyle='#f4ece8'; cx.fillRect(0,0,W,H);
        var jobs=[], ok=0;
        for(var ty=Math.floor(y0/S);ty<=Math.floor((y0+H-1)/S);ty++){
          for(var tx=Math.floor(x0/S);tx<=Math.floor((x0+W-1)/S);tx++){
            (function(tx,ty){ jobs.push(new Promise(function(r2){
              var im=new Image(), done=false; function fin(){ if(!done){ done=true; r2(); } }
              im.crossOrigin='anonymous';
              im.onload=function(){ try{ cx.drawImage(im,tx*S-x0,ty*S-y0,S,S); ok++; }catch(e){} fin(); };
              im.onerror=fin; setTimeout(fin,9000);
              im.src='https://tile.openstreetmap.org/'+z+'/'+(((tx%n)+n)%n)+'/'+ty+'.png';
            })); })(tx,ty);
          }
        }
        Promise.all(jobs).then(function(){
          if(tok!==mapTok) return res();
          if(!ok) return rej(new Error('tiles'));
          try{ var u=cv.toDataURL('image/jpeg',0.88); var bg=document.getElementById('p4mbg'); if(bg){ bg.style.backgroundImage='url('+u+')'; } var at=document.getElementById('p4at'); if(at) at.style.display='block'; res(); }catch(e){ rej(e); }
        });
      }).catch(function(){});
    }
    function flushMap(){ if(mapTimer){ clearTimeout(mapTimer); mapTimer=0; drawMap(); } return mapP; }
    renderSide(); ready=true; layoutMain(); refreshMain();
    function inlinePhotos(root){
      var els=Array.prototype.slice.call(root.querySelectorAll('[data-src]'));
      return Promise.all(els.map(function(el){
        var s=el.getAttribute('data-src')||''; if(!s||/^data:/.test(s)) return Promise.resolve();
        var m=/[?&]id=([\w-]+)/.exec(s); if(!m) return Promise.resolve();
        return api('GET',{action:'photoData',id:m[1]}).then(function(r){ if(r.ok&&r.dataUrl) setBg(el,r.dataUrl); }).catch(function(){});
      }));
    }
    function setBg(el,u){ el.setAttribute('data-src',u); el.style.backgroundImage='url("'+u+'")'; }
    function adjMsg(m){ var e=document.getElementById('adjmsg'); if(e) e.textContent=m||''; }
    function setMain(u){ var bx=document.getElementById('p4m'); setBg(bx,u); var np=bx.parentNode.querySelector('.p4-nophoto'); if(np) np.parentNode.removeChild(np); refreshMain(); }
    function thumbBtn(u,on,fn){ var b=document.createElement('button'); b.type='button'; if(on) b.className='on'; var im=document.createElement('img'); im.alt=''; im.src=u; b.appendChild(im); b.onclick=fn; return b; }
    function drawAdj(){
      var el=document.getElementById('th1'); el.innerHTML='';
      st.pool.forEach(function(u,i){ el.appendChild(thumbBtn(u,i===st.main,function(){ st.main=i; setMain(st.pool[i]); drawAdj(); })); });
      var e2=document.getElementById('th2'); e2.innerHTML='';
      var nb=document.createElement('button'); nb.type='button'; nb.textContent=t('adjNone'); if(!st.secs.length) nb.className='on'; nb.onclick=function(){ st.secs=[]; renderSide(); drawAdj(); }; e2.appendChild(nb);
      st.pool.forEach(function(u,i){ var at=st.secs.indexOf(i); e2.appendChild(thumbBtn(u,at>=0,function(){
        var k=st.secs.indexOf(i); if(k>=0) st.secs.splice(k,1); else { if(st.secs.length>=3) st.secs.shift(); st.secs.push(i); }
        renderSide(); drawAdj(); })); });
      document.getElementById('crop').disabled=st.main<0;
    }
    function toData(src){
      if(/^data:/.test(src)) return Promise.resolve(src);
      var m=/[?&]id=([\w-]+)/.exec(src); if(!m) return Promise.reject(new Error('src'));
      return api('GET',{action:'photoData',id:m[1]}).then(function(r){ if(r.ok&&r.dataUrl) return r.dataUrl; throw new Error('photoData'); });
    }
    function downscale(file){
      return new Promise(function(res,rej){
        var fr=new FileReader(); fr.onerror=function(){ rej(new Error('read')); };
        fr.onload=function(){ var im=new Image(); im.onerror=function(){ rej(new Error('img')); };
          im.onload=function(){ var w=im.naturalWidth, h2=im.naturalHeight, k=Math.min(1,1600/Math.max(w,h2)); var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h2*k)); var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.9)); };
          im.src=fr.result; };
        fr.readAsDataURL(file);
      });
    }
    var upSlot=1, fin=document.getElementById('fin');
    document.getElementById('up1').onclick=function(){ upSlot=1; fin.click(); };
    document.getElementById('up2').onclick=function(){ upSlot=2; fin.click(); };
    fin.onchange=function(){
      var f=fin.files&&fin.files[0]; fin.value=''; if(!f) return;
      adjMsg(t('adjBusy'));
      downscale(f).then(function(u){
        st.pool.push(u); var i=st.pool.length-1;
        if(upSlot===1){ st.main=i; setMain(u); } else { if(st.secs.length>=3) st.secs.pop(); st.secs.push(i); renderSide(); }
        adjMsg(''); drawAdj();
      }).catch(function(){ adjMsg(t('adjFail')); });
    };
    document.getElementById('ptel').oninput=function(){
      var v=this.value.replace(/[０-９]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); }).replace(/[^0-9+()\- ]/g,'').slice(0,20);
      if(v!==this.value) this.value=v;
      var el=document.getElementById('p4tel'); if(!el) return;
      el.innerHTML=v?'<small>'+esc(t('pTelLbl'))+'</small>'+esc(v):''; el.className='p4-tel'+(v?' on':''); el.parentNode.className='p4-ctq'+(v?' has':'');
      el.style.fontSize=(v.length>14?19:24)+'px';
    };
    document.getElementById('sws').onclick=function(ev){
      var b=ev.target; while(b&&b!==this&&b.tagName!=='BUTTON') b=b.parentNode;
      if(!b||b===this) return;
      var i=+b.getAttribute('data-c'), c=COLS[i].c, fl=document.querySelector('.flyer');
      st.col=i; CVARS.forEach(function(k,j){ fl.style.setProperty(k,c[j]); }); recolor(fl,c);
      Array.prototype.forEach.call(this.querySelectorAll('button'),function(x){ x.className=(x===b)?'on':''; });
    };
    function loadCropper(){
      if(window.Cropper) return Promise.resolve();
      return new Promise(function(res,rej){
        if(!document.getElementById('cropcss')){ var l=document.createElement('link'); l.id='cropcss'; l.rel='stylesheet'; l.href='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css'; document.head.appendChild(l); }
        var s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js';
        s.onload=function(){ window.Cropper?res():rej(new Error('cropper')); }; s.onerror=function(){ rej(new Error('cropper')); };
        document.head.appendChild(s);
      });
    }
    document.getElementById('crop').onclick=function(){
      if(st.main<0) return;
      var src=st.pool[st.main], btn=this; btn.disabled=true; adjMsg(t('adjBusy'));
      Promise.all([toData(src),loadCropper()]).then(function(a){
        adjMsg('');
        var ov=document.createElement('div'); ov.className='cropov noprint'; ov.id='cropov';
        ov.innerHTML='<p class="msg">'+esc(t('adjCropHint'))+'</p><div class="cropbox"><img id="cropimg" alt=""></div><div class="adjb"><button type="button" class="btn sm" id="cdo">'+esc(t('adjDo'))+'</button><button type="button" class="btn ghost sm" id="cno">'+esc(t('adjCancel'))+'</button></div>';
        document.body.appendChild(ov);
        var im=document.getElementById('cropimg'), cr=null;
        function close(){ try{ if(cr) cr.destroy(); }catch(e){} ov.remove(); drawAdj(); }
        im.onload=function(){
          cr=new Cropper(im,{viewMode:1,aspectRatio:252/316,autoCropArea:1,background:false,ready:function(){ cr.setAspectRatio(NaN); }});
          window.__cropper=cr;
        };
        im.src=a[0];
        document.getElementById('cno').onclick=close;
        document.getElementById('cdo').onclick=function(){
          if(!cr) return;
          var c=cr.getCroppedCanvas({maxWidth:1600,maxHeight:1600,fillColor:'#fff'});
          if(!c){ close(); return; }
          var u=c.toDataURL('image/jpeg',0.9);
          st.pool.push(u); st.main=st.pool.length-1; setMain(u); close();
        };
      }).catch(function(){ adjMsg(t('adjCropFail')); }).then(function(){ btn.disabled=st.main<0; });
    };
    drawAdj();
    /* capture: clone the fixed 620px poster (no transform) and render it at 3x. A4 has the same ratio, so image and PDF are the same picture */
    function capture1(scale,noSvg){
      var fl=document.querySelector('.flyer'), wrap=null;
      /* html2canvas measures text baselines with a probe img appended to body in the live document; the site-wide img{display:block} makes it drop all text about half an em, so make the probe inline while capturing */
      var fx=document.createElement('style'); fx.textContent='body>div>img{display:inline-block !important}'; document.head.appendChild(fx);
      function clean(){ if(fx.parentNode) fx.parentNode.removeChild(fx); if(wrap&&wrap.parentNode) wrap.parentNode.removeChild(wrap); }
      return fontsReady().then(function(){ fitHead(); return Promise.all([inlinePhotos(fl),flushMap()]); }).then(function(){
        if(!window.html2canvas) throw new Error('lib');
        wrap=document.createElement('div'); wrap.className='capwrap';
        var cl=fl.cloneNode(true); cl.removeAttribute('id'); cl.classList.add('cap'); cl.style.transform='none'; wrap.appendChild(cl); document.body.appendChild(wrap);
        if(noSvg){ Array.prototype.slice.call(cl.querySelectorAll('svg')).forEach(function(x){ if(x.parentNode) x.parentNode.removeChild(x); }); }
        return new Promise(function(r){ setTimeout(r,200); }).then(function(){ return html2canvas(cl,{scale:scale,backgroundColor:'#ffffff',useCORS:true,logging:false,width:620,height:877,windowWidth:620}); });
      }).then(function(c){ clean(); c.toDataURL('image/jpeg',0.5); return c; },function(e){ clean(); throw e; });
    }
    /* iPhoneで失敗する時のため、重い設定から順に3回まで試す。最後の失敗理由は lastErr に残す */
    var lastErr='';
    function capture(scale){
      var plan=[[scale,false],[2,false],[1.6,true]];
      function go(i){ return capture1(plan[i][0],plan[i][1]).catch(function(e){ lastErr=String(e&&(e.message||e.name)||e).slice(0,160); if(i+1<plan.length) return go(i+1); throw e; }); }
      return go(0);
    }
    function failMsg(k){ return '<p class="err">'+esc(t(k))+'</p>'+(lastErr?'<p class="help" style="font-size:12px;color:#888">('+esc(lastErr)+')</p>':''); }
    document.getElementById('pr').onclick=function(){
      var out=document.getElementById('imgout'), btn=document.getElementById('pr'); btn.disabled=true; out.innerHTML='<p class="msg">'+esc(t('pdfBusy'))+'</p>';
      capture(3).then(function(c){
        if(!window.jspdf) throw new Error('lib');
        var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
        var w=204, hh=w*c.height/c.width;
        pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',(210-w)/2,(297-hh)/2,w,hh);
        var blob=pdf.output('blob'), name='maigo-poster-'+p.id+'.pdf', url=URL.createObjectURL(blob);
        var file=null; try{ file=new File([blob],name,{type:'application/pdf'}); }catch(e){}
        out.innerHTML='<p class="help">'+esc(t('pdfHint'))+'</p><div class="btns"><a class="btn" id="pdfopen" href="'+url+'" target="_blank" rel="noopener" download="'+name+'">'+esc(t('pdfOpen'))+'</a></div>';
        if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
          document.getElementById('pdfopen').onclick=function(ev){ ev.preventDefault(); navigator.share({files:[file]}).catch(function(){ window.open(url,'_blank'); }); };
        }
        btn.disabled=false; out.scrollIntoView({block:'start'});
      }).catch(function(e){ if(!lastErr) lastErr=String(e&&(e.message||e.name)||e).slice(0,160); out.innerHTML=failMsg('pdfFail'); btn.disabled=false; });
    };
    document.getElementById('sv').onclick=function(){
      var out=document.getElementById('imgout'), btn=document.getElementById('sv'); btn.disabled=true; out.innerHTML='<p class="msg">'+esc(t('saveBusy'))+'</p>';
      capture(3).then(function(c){
        out.innerHTML='<p class="help">'+esc(t('saveHint'))+'</p><img src="'+c.toDataURL('image/jpeg',0.92)+'" alt="" style="width:100%;border:1px solid var(--rose-pale)">';
        btn.disabled=false; out.scrollIntoView({block:'start'});
      }).catch(function(e){ if(!lastErr) lastErr=String(e&&(e.message||e.name)||e).slice(0,160); out.innerHTML=failMsg('saveFail'); btn.disabled=false; });
    };
  });
}

function viewGuide(id,city){
  var a=area(id)||area('tokyo');
  function row(c){
    var telHtml = c.tel ? '<a href="tel:'+esc(c.tel.replace(/[^0-9+]/g,''))+'" style="display:inline-flex;align-items:center;min-height:44px">'+esc(c.tel)+'</a>'
      : (c.url ? '<a href="'+esc(c.url)+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;min-height:44px">'+esc(t('mapSearch'))+'</a>' : '<span class="help" style="display:inline-flex;align-items:center;min-height:44px">'+esc(t('numSee'))+'</span>');
    return '<div style="padding:12px 0;border-bottom:1px solid var(--rose-pale)">'+esc(c.label)+'<br>'+telHtml+'</div>';
  }
  var cs=a.contacts||[];
  var main=cs.filter(function(c){return c.tel;}), fixed=cs.filter(function(c){return !c.tel;});
  var wards=[];
  if(a.wards&&city){ Object.keys(a.wards).forEach(function(k){ if(String(city).indexOf(k)>=0) wards=wards.concat(a.wards[k]); }); }
  var h=crumb('#/area/'+a.id,t('listOf',pname(a)))+'<div class="eyebrow">'+esc(t('gEyebrow'))+'</div><h1>'+esc(t('gTitle',pname(a)))+'</h1>';
  if(!fixed.length) fixed=[{label:T.ja.policeFallback,tel:'',url:'https://www.google.com/maps/search/警察署'}];
  if(lang==='en') h+='<p class="lead">'+esc(t('gEnLine'))+'</p>';
  h+='<div class="notice" style="padding:6px 20px">'+main.concat(wards).concat(fixed).map(row).join('')+'</div>';
  var center=(lang==='ja'&&main.length)?main[0].label:t('centerGeneric');
  h+='<h2>'+esc(t('gFinderH'))+'</h2><p>'+esc(t('gFinderP'))+'</p>';
  h+='<h2>'+esc(t('gOwnerH'))+'</h2><p>'+esc(t('gOwnerP',center))+'</p>';
  h+=noticeHtml()+'<div class="btns"><a class="btn" href="#/new?area='+a.id+'">'+esc(t('post'))+'</a></div>';
  app.innerHTML=h;
}

function viewLegal(k){
  var note=(lang==='en'&&t('legalEnNote'))?'<div class="notice">'+esc(t('legalEnNote'))+'</div>':'';
  app.innerHTML=crumb('#/',t('pickArea'))+'<div class="legal">'+note+LEGAL[k]+'</div>';
}
function viewAbout(){
  var body=t('aboutBody'); if(!Array.isArray(body)) body=[String(body)];
  app.innerHTML=crumb('#/',t('pickArea'))+'<div class="eyebrow">About</div><h1>'+esc(t('aboutTitle'))+'</h1>'+body.map(function(x){return '<p class="about">'+esc(x)+'</p>';}).join('')+'<div class="btns"><a class="btn" href="#/new">'+esc(t('post'))+'</a></div>';
}
function viewSubscribe(areaId){
  var sel=areaId&&area(areaId)&&area(areaId).open?areaId:'tokyo';
  app.innerHTML=crumb('#/area/'+sel,t('backList'))+'<div class="eyebrow">'+esc(t('sEyebrow'))+'</div><h1>'+esc(t('sTitle'))+'</h1><p class="lead">'+esc(t('sLead'))+'</p>'
  +'<form id="f" novalidate><div class="field"><label class="l" for="area">'+esc(t('lArea'))+'</label>'+areaSelect('area',sel)+'</div>'
  +'<div class="field"><label class="l" for="email">'+esc(t('lEmail2'))+'</label><input type="email" id="email" inputmode="email" autocapitalize="off" autocorrect="off"></div>'
  +'<p class="err" id="formerr" role="alert"></p><button type="submit" class="btn block" id="go">'+esc(t('register'))+'</button></form>';
  document.getElementById('f').addEventListener('submit',function(ev){
    ev.preventDefault(); showErr('');
    var d={action:'subscribe',area:val('area'),email:val('email')};
    if(!validEmail(d.email)) return showErr(t('badEmail'));
    var b=document.getElementById('go'); b.disabled=true; b.textContent=t('sending');
    api('POST',null,d).then(function(r){
      if(!r.ok){ b.disabled=false; b.textContent=t('register'); return showErr(r.error||t('regFail')); }
      app.innerHTML='<div class="eyebrow">'+esc(t('sentEyebrow'))+'</div><h1>'+esc(t('sSent'))+'</h1><p class="lead">'+esc(t('sSentLead',areaName(d.area)))+'</p><div class="btns"><a class="btn ghost" href="#/area/'+esc(d.area)+'">'+esc(t('toList'))+'</a></div>';
    });
  });
}
